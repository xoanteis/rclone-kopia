<h1>Política de privacidade</h1>
<p>rclone-kopia é unha aplicación de uso persoal cun único usuario. Só accede aos ficheiros que ela mesma crea no Google Drive do propietario (permiso drive.file), para gardar copias de seguridade cifradas.</p>
<p>Non recolle, comparte nin envía datos a terceiros.</p>
